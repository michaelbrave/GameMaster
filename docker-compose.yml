services:
  postgres:
    image: postgres:16-alpine
    container_name: worldforge-postgres
    environment:
      POSTGRES_USER: worldforge
      POSTGRES_PASSWORD: worldforge
      POSTGRES_DB: worldforge
    ports:
      - "5432:5432"
    volumes:
      - worldforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldforge -d worldforge"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  worldforge-pgdata:
